<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - MindGlow</title>
<script>if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');</script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    :root{ --purple: #A855F7; --black: #130505; }
    body { background: #F8F8F8; }
    :root { 
    --pink: #E91E63; 
    --light-pink: #FDF2F9; 
    --bg: var(--light-pink); 
    --text: #000; 
    --card: #fff; 
}
body.dark { 
    --bg: #121212; 
    --text: #fff; 
    --card: #1e1e1e; 
}
body { 
    background: var(--bg); 
    color: var(--text); 
}


    /* الشريط العلوي */
    .topbar { 
        background: var(--black); 
        padding: 15px 50px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-radius: 0 0 25px 25px; 
    }
    .logo { font-size: 28px; font-weight: 900; color: white; }
    .logo span { color: var(--purple); }
    .nav { display: flex; gap: 10px; }
    .nav a { background: var(--card); color: var(--black); padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 14px; }

    /* صندوق تسجيل الدخول */
    .container { 
        display: flex; 
        max-width: 1000px; 
        margin: 60px auto; 
        background: white; 
        border-radius: 20px; 
        overflow: hidden; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
    }
    .form-side { 
        flex: 1; 
        padding: 50px 40px; 
        background: #F5F0FF; /* خلفية بنفسجي فاتح */
    }
    h2 { font-size: 28px; margin-bottom: 30px; color: var(--black); }
    
    .input { 
        width: 100%; 
        padding: 12px 15px; 
        margin: 10px 0; 
        border: 1px solid #ddd; 
        border-radius: 10px; 
        font-size: 14px;
        background: var(--card);
        outline: none;
    }
    .input:focus {
        border: 2px solid var(--purple);
    }

    .btn { 
        background: var(--purple); /* بنفسجي */
        color: white; 
        border: none; 
        padding: 14px; 
        border-radius: 50px; /* مدور */
        width: 100%; 
        font-size: 16px; 
        font-weight: bold; 
        cursor: pointer;
        display: block;
        text-align: center;
        text-decoration: none;
        margin-top: 15px;
        letter-spacing: 1px;
    }
    .btn:hover {
        background: #9333EA; /* يغمق لما تحطي الماوس */
    }

    .image-side { 
        flex: 1; 
    }
    .image-side img { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
    }

    .signup-link {
        text-align: center; 
        margin-top: 15px; 
        font-size: 14px; 
        color: #555;
    }
    .signup-link a {
        color: var(--purple); 
        font-weight: bold; 
        text-decoration: none;
    }
</style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="topbar">
        <div class="logo">MIND<span>GLOW</span></div>
        <div class="nav">
            <a href="index.html">🏠 HOME</a>
            <a href="signup.html">SIGN UP</a>
        </div>
    </div>

    <!-- صندوق تسجيل الدخول -->
    <div class="container">
        <div class="form-side">
            <h2>Sign In :- 👤</h2>
           <form id="loginForm">
                <input class="input" type="email" name="email" placeholder="Email" required>
                <input class="input" type="password" name="password" placeholder="Password" required>
                
                <!-- الزر بودي على الداشبورد -->
                <button class="btn">LOG IN</button>
            </form>
            <p class="signup-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
        <div class="image-side">
            <img src="images/books.jpg" alt="Student studying">
        </div>
    </div>

<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function (event) {

        // منع الصفحة من عمل refresh
        event.preventDefault();

        // جلب البيانات
        var email =
            document.querySelector(
                'input[name="email"]'
            ).value;

        var password =
            document.querySelector(
                'input[name="password"]'
            ).value;


        try {

            // إرسال البيانات إلى Backend
            var response = await fetch(
                "http://localhost:3000/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            var data = await response.json();


            // Login ناجح
            if (response.ok) {

                // حفظ بيانات المستخدم
                localStorage.setItem(
                    "firstname",
                    data.user.firstname
                );

                localStorage.setItem(
                    "lastname",
                    data.user.lastname
                );

                localStorage.setItem(
                    "email",
                    data.user.email
                );
            localStorage.setItem(
            "userId",
              data.user.id
               );

                alert(
                    "Login successful! Welcome " +
                    data.user.firstname
                );


                // الانتقال إلى Dashboard
                window.location.href =
                    "dashboard.html";


            } else {

                // Login فاشل
                alert(
                    data.message ||
                    "Email or password is incorrect."
                );

            }

        } catch (error) {

            console.log(error);

            alert(
                "Cannot connect to the server."
            );

        }

    }
);

</script>


</body>
</html>
