<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<script>if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');</script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
    body { background: #fff; padding: 15px; }
    :root { 
    --pink: #581c87; 
    --light-pink: #FDF2F9; 
    --bg: var(--light-pink); 
    --text: #000; 
    --card: #fff; 
}
body.dark { 
    --bg: #121212; 
    --text: #fff; 
    --card: #1e1e1e; 
}
body { 
    background: var(--bg); 
    color: var(--text); 
}


    :root {
        --pink: #581c87;
        --black: #130505;
    }

    /* 1. الهيدر - قربت الناف لليمين */
    .header-bar {
        background: var(--black);
        border-radius: 30px;
        padding: 10px 20px;
        display: flex;
        justify-content: flex-start; /* بخلي اللوجو شمال والناف يمين */
        align-items: center;
        gap: 100px;
        max-width: 1350px;
        margin: 0 auto 8px auto;
    }
    .nav-pill {
        background: var(--card);
        border-radius: 25px;
        padding: 5px;
        display: flex;
        gap: 6px;
        margin-left: auto; /* هذا اللي زاحه لليمين */
    }
    .nav-btn {
        background: var(--card);
        border: none;
        border-radius: 20px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        text-decoration: none;
        color: black;
    }
    .search-pill {
        background: white;
        border: 2px solid var(--pink);
        border-radius: 25px;
        padding: 6px 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 250px;
    }

    .pink-divider {
        height: 10px;
        background: #581c87;
        border-radius: 10px;
        max-width: 1350px;
        margin: 0 auto 25px auto;
    }

    /* 2. المحتوى */
    .container {
        display: flex;
        gap: 25px;
        max-width: 1350px;
        margin: 0 auto;
    }

    /* الفورم */
    .form-col { flex: 1.4; }
    .form-col h2 { font-size: 30px; margin-bottom: 15px; }
    .input-black {
        background: var(--black);
        color: wheat; /* غيرت الموف لابيض عشان يبين */
        border: 2px solid var(--pink);
        border-radius: 25px;
        padding: 12px 20px;
        width: 100%;
        margin-bottom: 12px;
        font-size: 14px;
        outline: none;
    }
    .input-black::placeholder { color: white; opacity: 0.7; } /* البلايس هولدر ابيض */
    .row { display: flex; gap: 12px; align-items: center; } /* align-items عشان الزر بالنص */
    .btn-white-pink {
        background: var(--card);
        border: 2px solid var(--pink);
        color: var(--text);
        border-radius: 25px;
        padding: 12px 35px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        height: 46px; /* نفس طول الانبوت */
        white-space: nowrap; /* عشان Sign Up ما تنزل سطرين */
    }

    /* القلب - صغرته شوي */
    .heart-col {
        flex: 1;
        border: 3px solid var(--pink);
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px; /* قللت البادنج */
    }
    .heart-big { font-size: 90px; color: red; } /* صغرت الخط */

    /* الناف الجانبي */
    .side-col { width: 230px; }
    .side-box {
        border: 3px solid var(--pink);
        border-radius: 15px;
        padding: 8px;
    }
    .side-item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid #ddd;
        padding: 10px 15px;
        margin-bottom: 8px;
        font-weight: 600;
        clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
    }

    /* 3. الفوتر - قربت الصناديق عبعض */
    .footer-stats {
        background: var(--black);
        border: 3px solid var(--pink);
        border-radius: 30px;
        padding: 12px 15px; /* قللت البادنج الجوانب */
        display: flex;
        justify-content: space-between; /* بخليهم لازقين ببعض */
        gap: 10px; /* مسافة صغيرة بينهم */
        max-width: 1350px;
        margin: 25px auto 0 auto;
    }
    .stat {
        background: var(--card);
        border-radius: 25px;
        padding: 8px 12px; /* صغرت البادنج */
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: bold;
        font-size: 12px;
        flex: 1; /* بخليهم كلهم نفس العرض */
        justify-content: center;
        /* 1. تاثير عام لكل الازرار والروابط اللي شكلها زر */
button, 
.nav-btn,
.side-item,
.stat,
.btn-white-pink {
    cursor: pointer;
    transition: 0.2s all ease; /* الحركة الناعمة */
}

/* 2. لما تحطي الماوس */
button:hover, 
.nav-btn:hover,
.side-item:hover,
.stat:hover,
.btn-white-pink:hover {
    transform: translateY(-2px); /* يطلع لفوق شوي */
    box-shadow: 0 4px 10px rgba(230, 23, 181, 0.3); /* ظل وردي */
}

/* 3. لما تضغطي */
button:active, 
.nav-btn:active,
.side-item:active,
.stat:active,
.btn-white-pink:active {
    transform: translateY(0) scale(0.97); /* ينزل لتحت ويصغر */
    box-shadow: 0 2px 5px rgba(230, 23, 181, 0.2);
}

/* 4. تاثير خاص للناف الجانبي - السهم */
.side-item:hover {
    background: var(--pink);
    color: white;
}

    }
</style>
</head>
<body>

    <div class="header-bar">
        <div class="logo" style="background:white; border-radius:20px; padding:5px 15px; font-weight:bold;">MindGlow<br><small>www.mindglow.com</small></div>
        <nav class="nav-pill">
            <a href="index.html" class="nav-btn">🏠 HOME</a>
            <a href="courses.html" class="nav-btn">📚 COURSES</a>
            <a href="settings.html" class="nav-btn">⚙️ SETTINGS</a>
            <a href="contact.html" class="nav-btn">📞 CALL US</a>
            <a  href="dashboard.html" class="nav-btn">👤 ACCOUNT</a>
        </nav>
        <div class="search-pill"><input placeholder=""><span>🔍</span></div>
    </div>
    <div class="pink-divider"></div>

    <div class="container">
        <form id="signupForm">
        <section class="form-col">
            <h2>Sign Up :- 👤</h2>
            <input class="input-black" type="text" name="firstname" placeholder="First name" required>
            <input class="input-black" type="text" name="lastname" placeholder="Last name" required>
            <div class="row">
                <input class="input-black" type="text" name="phone" placeholder="Phone number">
                <input class="input-black" type="email" name="email" placeholder="Your Email Address" required>
            </div>
            <div class="row">
                <input class="input-black" type="text" name="gender" placeholder="Gender">
                <input class="input-black" type="password" name="password" placeholder="Password" required>
            </div>
            <div class="row">
                <input class="input-black" type="date" name="birthday">
                <button type="submit" class="btn-white-pink">Sign Up</button>
            </div>
            </form>
        </section>

        <div class="heart-col">
            <div class="heart-big">❤️</div>
        </div>

       
    
    </div>

    <footer class="footer-stats">
        <div class="stat">⭐ 100K+ Students</div>
        <div class="stat">📝 50+ Lessons</div>
        <div class="stat">📋 30+ Subjects</div>
        <div class="stat">👩‍🏫 800+ teacher</div>
        <div class="stat">✅ 97% Satisfaction Rate</div>
    </footer>
    <script>
document.getElementById("signupForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const data = {
        firstname: document.querySelector('input[name="firstname"]').value,
        lastname: document.querySelector('input[name="lastname"]').value,
        phone: document.querySelector('input[name="phone"]').value,
        email: document.querySelector('input[name="email"]').value,
        gender: document.querySelector('input[name="gender"]').value,
        password: document.querySelector('input[name="password"]').value,
        birthday: document.querySelector('input[name="birthday"]').value
    };

    try {

        const response = await fetch("http://localhost:3000/signup", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.message);
            return;
        }

        localStorage.setItem("firstname", data.firstname);
        localStorage.setItem("lastname", data.lastname);
        localStorage.setItem("email", data.email);

        alert("Account created successfully!");

        window.location.href = "login.html";

    } catch (error) {

        alert("Cannot connect to the server.");

        console.log(error);
    }

});
</script>

</body>
</html>
